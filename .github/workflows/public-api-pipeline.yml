name: Public API coverage pipeline

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-api-coverage-pipeline
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync the complete catalog
        env:
          AGENTROUTER_ADMIN_TOKEN: ${{ secrets.AGENTROUTER_ADMIN_TOKEN }}
        run: |
          test -n "$AGENTROUTER_ADMIN_TOKEN"
          curl --fail-with-body --silent --show-error \
            --retry 3 \
            -H "Authorization: Bearer $AGENTROUTER_ADMIN_TOKEN" \
            -X POST https://agentrouter.network/studio/public-api-pipeline/sync

  convert:
    needs: sync
    if: always() && (needs.sync.result == 'success' || needs.sync.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Start one bounded conversion batch
        env:
          AGENTROUTER_ADMIN_TOKEN: ${{ secrets.AGENTROUTER_ADMIN_TOKEN }}
        run: |
          test -n "$AGENTROUTER_ADMIN_TOKEN"
          curl --fail-with-body --silent --show-error \
            --retry 3 \
            -H "Authorization: Bearer $AGENTROUTER_ADMIN_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"limit":10,"concurrency":3}' \
            -X POST https://agentrouter.network/studio/public-api-pipeline/start
