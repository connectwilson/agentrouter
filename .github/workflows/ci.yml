name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: git diff --check "${{ github.event.pull_request.base.sha || github.event.before }}" HEAD
      - run: node scripts/public-repo-secret-scan.js
      - run: npm test
      - run: npm run mcp:npm:pack
      - run: npm run mcp-package-smoke
      - run: npm run audit:dependencies
      - name: Verify production container runtime permissions
        run: |
          docker build --tag agentrouter-ci .
          docker run --rm --entrypoint sh agentrouter-ci -c 'test "$(id -u)" -ne 0 && test -w /app/providers && touch /app/providers/.write-smoke'

  postgres-persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agentrouter
          POSTGRES_PASSWORD: agentrouter_test
          POSTGRES_DB: agentrouter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentrouter -d agentrouter_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify Postgres persistence safety boundaries
        env:
          TEST_DATABASE_URL: postgresql://agentrouter:agentrouter_test@127.0.0.1:5432/agentrouter_test
        run: node --test test/postgres-persistence-integration.test.js
