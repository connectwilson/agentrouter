services:
  - type: web
    name: agentrouter-markets
    runtime: docker
    plan: free
    repo: https://github.com/connectwilson/agentrouter-markets
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /agent-router/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: ADN_BROWSER_HANDOFF_SECRET
        sync: false
      - key: ADN_PROVIDER_RECEIVE_ADDRESS
        value: 0x2c4d600a04c0d3bbb1e3cc8a13e54e21c2b6c0bb
      - key: ADN_PROVIDER_SECRET_PASSPHRASE
        sync: false
      - key: ADN_ADMIN_API_TOKEN
        sync: false
      - key: ADN_SETTLEMENT_CHAIN
        value: bsc
      - key: ADN_SETTLEMENT_RPC_URL
        value: https://bsc-dataseed.binance.org
      - key: ADN_SETTLEMENT_ASSET
        value: USDC
      - key: ADN_EVIDENCE_ANCHOR_CONTRACT
        sync: false
      - key: ADN_EVIDENCE_ANCHOR_PRIVATE_KEY
        sync: false
      - key: ADN_ERC8004_EXTERNAL_API_AGENT_ID_BSC
        sync: false
      - key: ADN_UPSTREAM_X402_PRIVATE_KEY
        sync: false
  - type: web
    name: agentrouter-markets-sg
    runtime: docker
    region: singapore
    plan: starter
    repo: https://github.com/connectwilson/agentrouter-markets
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /agent-router/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: AGENT_ROUTER_PUBLIC_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ADN_BROWSER_HANDOFF_SECRET
        sync: false
      - key: ADN_PROVIDER_RECEIVE_ADDRESS
        value: 0x2c4d600a04c0d3bbb1e3cc8a13e54e21c2b6c0bb
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: ADN_PROVIDER_SECRET_PASSPHRASE
        sync: false
      - key: ADN_ADMIN_API_TOKEN
        sync: false
      - key: ADN_SETTLEMENT_CHAIN
        value: bsc
      - key: ADN_SETTLEMENT_RPC_URL
        value: https://bsc-dataseed.binance.org
      - key: ADN_SETTLEMENT_ASSET
        value: USDC
      - key: ADN_EVIDENCE_ANCHOR_CONTRACT
        sync: false
      - key: ADN_EVIDENCE_ANCHOR_PRIVATE_KEY
        sync: false
      - key: ADN_ERC8004_EXTERNAL_API_AGENT_ID_BSC
        sync: false
      - key: ADN_UPSTREAM_X402_PRIVATE_KEY
        sync: false
  - type: worker
    name: binance-futures-delist-monitor
    runtime: docker
    region: singapore
    plan: starter
    repo: https://github.com/connectwilson/agentrouter-markets
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: node scripts/monitor-binance-futures-delists.js --interval 30000
    envVars:
      - key: NODE_ENV
        value: production
      - key: BARK_URL
        sync: false
      - key: BARK_GROUP
        value: Binance
      - key: BARK_SOUND
        value: alarm
      - key: BARK_LEVEL
        value: timeSensitive
